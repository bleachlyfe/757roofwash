backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "roof-cleaning"
    label: "Roof Cleaning City Pages"
    folder: "content/roof-cleaning"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Page Title (internal)", name: "title", widget: "string" }
      - { label: "URL Slug (e.g. /roof-cleaning-norfolk-va/)", name: "url", widget: "string", hint: "Must start and end with /" }
      - { label: "City", name: "city", widget: "string", hint: "Used throughout the page copy, e.g. Norfolk" }
      - { label: "Type", name: "type", widget: "hidden", default: "roof-cleaning" }
      - { label: "Meta Title", name: "metaTitle", widget: "string" }
      - { label: "Meta Description", name: "metaDescription", widget: "text" }
      - label: "Before/After Gallery Pairs"
        name: "gallery"
        widget: "list"
        fields:
          - { label: "Before Photo", name: "before", widget: "image", required: false }
          - { label: "After Photo", name: "after", widget: "image", required: false }
      - label: "Reviews"
        name: "reviews"
        widget: "list"
        required: false
        fields:
          - { label: "Name (abbreviate last name, e.g. 'Ron R.')", name: "name", widget: "string" }
          - { label: "Rating (1-5)", name: "rating", widget: "number", default: 5, min: 1, max: 5 }
          - { label: "Source", name: "source", widget: "string", default: "Google review" }
          - { label: "Review Text", name: "text", widget: "text" }

  - name: "legal"
    label: "Legal Pages"
    folder: "content/legal"
    create: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL", name: "url", widget: "string" }
      - { label: "Type", name: "type", widget: "hidden", default: "legal" }
      - { label: "Body", name: "body", widget: "markdown" }

