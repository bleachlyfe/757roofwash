<header class="site-header">
  <div class="wrap-wide">
    <a class="brand" href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;" aria-label="{{ .Site.Params.businessName }} — back to top">
      <img src="/images/site/logo.webp" alt="{{ .Site.Params.businessName }}" class="brand-logo" width="177" height="88">
    </a>
    <div class="header-actions">
      <a class="header-phone" href="{{ .Site.Params.phoneHref | safeURL }}">Call Now: {{ .Site.Params.phoneDisplay }}</a>
      <a class="btn btn-cta" href="#quote-form">Get My Free Roof Quote</a>
    </div>
  </div>
</header>
